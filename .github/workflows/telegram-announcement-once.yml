name: Approved site announcement - once only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-capabilities-announcement
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send approved announcement once
        if: github.run_attempt == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "
          const fs=require('fs');
          const text=fs.readFileSync('.github/announcements/site-capabilities.html','utf8').trim();
          const t=process.env.TELEGRAM_BOT_TOKEN;
          fetch('https://api.telegram.org/bot'+t+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,text,parse_mode:'HTML',link_preview_options:{is_disabled:true}})})
          .then(r=>r.json()).then(d=>{console.log(JSON.stringify({ok:d.ok,message_id:d.result&&d.result.message_id,error:d.ok?undefined:String(d.description||'').replaceAll(t,'[REDACTED]')}));if(!d.ok)process.exit(1);});
          "
